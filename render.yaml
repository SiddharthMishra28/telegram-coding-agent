services:
  - type: web
    name: telegram-coding-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AGENT_TONE
        value: friendly
      - key: AGENT_NAME
        value: CodeAgent
      - key: AGENT_EMOJI
        value: true
